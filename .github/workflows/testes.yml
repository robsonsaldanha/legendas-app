name: Testes

on:
  push:
    branches: ["**"]          # marcas (liberar-*) não rodam os testes de novo
  pull_request:
  workflow_dispatch:

jobs:
  testes-windows:
    name: Testes (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar ffmpeg
        run: choco install ffmpeg -y --no-progress
      - name: Instalar dependências
        run: pip install -r requirements-dev.txt
      - name: Detector de voz e áudio de teste (Silero VAD, MIT)
        shell: pwsh
        run: |
          Invoke-WebRequest https://raw.githubusercontent.com/snakers4/silero-vad/v6.2.3/src/silero_vad/data/silero_vad.onnx -OutFile "$env:RUNNER_TEMP\silero_vad.onnx"
          Invoke-WebRequest https://raw.githubusercontent.com/snakers4/silero-vad/v6.2.3/tests/data/test.wav -OutFile "$env:RUNNER_TEMP\vad_test.wav"
          Invoke-WebRequest https://github.com/TRvlvr/model_repo/releases/download/all_public_uvr_models/UVR-MDX-NET-Voc_FT.onnx -OutFile "$env:RUNNER_TEMP\sep.onnx"
      - name: Rodar testes
        env:
          CNT_VAD_MODEL: ${{ runner.temp }}\silero_vad.onnx
          CNT_VAD_TEST_WAV: ${{ runner.temp }}\vad_test.wav
          CNT_SEP_MODEL: ${{ runner.temp }}\sep.onnx
        run: python -m pytest -q

  testes-unix:
    name: Testes (${{ matrix.nome }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, nome: Linux }
          - { os: macos-latest, nome: Mac }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar ffmpeg
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get update -q && sudo apt-get install -y -q ffmpeg; else brew install ffmpeg; fi
      - name: Instalar dependências
        run: pip install -r requirements-dev.txt
      - name: Rodar testes
        run: python -m pytest -q

  alinhamento-real:
    name: Alinhamento real (wav2vec2, Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar ffmpeg
        run: choco install ffmpeg -y --no-progress
      - name: Instalar dependências (com torch CPU)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt -r requirements-align.txt -r requirements-whisper.txt
          pip install --no-deps faster-whisper==1.2.1
      - name: Cache dos modelos de alinhamento
        uses: actions/cache@v4
        with:
          path: ~\AppData\Roaming\CNT Legendas\modelos
          key: modelos-wav2vec2-v1
      - name: Sintetizar fala de teste (voz do Windows)
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Speech
          $s = New-Object System.Speech.Synthesis.SpeechSynthesizer
          $s.Rate = -1
          $s.SetOutputToWaveFile("$env:RUNNER_TEMP\fala.wav")
          $ssml = '<speak version="1.0" xmlns="http://www.w3.org/2001/10/synthesis" xml:lang="en-US">The quick brown fox jumps over the lazy dog. <break time="2s"/> Then the dog wakes up and runs after the fox across the green field.</speak>'
          $s.SpeakSsml($ssml)
          $s.Dispose()
          Get-Item "$env:RUNNER_TEMP\fala.wav" | Select-Object Length
      - name: Fala com dois idiomas (português + inglês)
        shell: pwsh
        run: |
          pip install gTTS==2.5.4
          $py = @'
          import subprocess, sys
          from gtts import gTTS
          parts = [("pt", "Olá, tudo bem? Hoje nós vamos viajar para a praia com a família inteira."),
                   ("en", "Excuse me, where is the train station? I am completely lost."),
                   ("pt", "Ele é um turista, vamos ajudar o rapaz a encontrar a estação.")]
          files = []
          for i, (lang, text) in enumerate(parts):
              f = rf"{sys.argv[1]}\parte{i}.mp3"
              gTTS(text, lang=lang).save(f)
              files.append(f)
          args = ["ffmpeg", "-y", "-loglevel", "error"]
          for f in files:
              args += ["-i", f]
          n = len(files)
          flt = "".join(f"[{i}:a]apad=pad_dur=1[a{i}];" for i in range(n)) + "".join(f"[a{i}]" for i in range(n)) + f"concat=n={n}:v=0:a=1[o]"
          subprocess.run(args + ["-filter_complex", flt, "-map", "[o]", "-ar", "16000", "-ac", "1",
                                 rf"{sys.argv[1]}\misto.wav"], check=True)
          '@
          Set-Content -Path "$env:RUNNER_TEMP\misto.py" -Value $py
          python "$env:RUNNER_TEMP\misto.py" "$env:RUNNER_TEMP"
          Get-Item "$env:RUNNER_TEMP\misto.wav" | Select-Object Length
      - name: Rodar teste de alinhamento
        env:
          WHISPER_MIXED_WAV: ${{ runner.temp }}\misto.wav
          ALIGN_TEST_WAV: ${{ runner.temp }}\fala.wav
          ALIGN_TEST_TEXT: "The quick brown fox jumps over the lazy dog. Then the dog wakes up and runs after the fox across the green field."
          ALIGN_TEST_AFTER_PAUSE: "Then"
          ALIGN_TEST_LANG: en
          WHISPER_TEST_WAV: ${{ runner.temp }}\fala.wav
        run: python -m pytest tests/test_align_real.py tests/test_whisper_real.py -v -s -rs --strict-markers -p no:cacheprovider; if ($LASTEXITCODE -ne 0) { exit 1 }
        shell: pwsh
