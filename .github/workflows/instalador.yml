name: Instalador

# Em todo push na main ou na dev: monta, instala, testa e desinstala. Se tudo passar:
# - dev  → canal "desenvolvimento": o pacote de atualização vai para dev-legendas.cntoficial.com.br
#          e o instalador fica na pré-versão "desenvolvimento" (substituída a cada montagem);
# - main → canal "producao": publica a versão v<versão>.<montagem> e, quando o servidor de
#          produção estiver ligado (variável CNT_PROD_ATIVO = 1), envia o pacote para ele.
# Um commit com "[instalador]" na mensagem obriga quem atualiza a rodar o instalador inteiro
# (use quando mudar bibliotecas, o Python embutido ou o cntboot.py).
on:
  push:
    branches: [main, dev]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CNT_CANAL: ${{ github.ref == 'refs/heads/dev' && 'desenvolvimento' || 'producao' }}
  CNT_BUILD: ${{ github.run_number }}

jobs:
  instalador:
    name: Gerar e testar o instalador (Windows)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Cache de downloads
        uses: actions/cache@v4
        with:
          path: build\downloads
          key: downloads-py3.12.10-ffmpeg-v2
      - name: Montar programa e gerar instalador
        shell: pwsh
        run: .\packaging\build.ps1

      - name: Instalar (silencioso), como faria no PC dela
        shell: pwsh
        run: |
          $exe = Get-ChildItem build\Output\Instalador_CNT_Legendas_*.exe | Select-Object -First 1
          "Tamanho do instalador: {0:N0} MB" -f ($exe.Length / 1MB)
          $p = Start-Process $exe.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/SP-","/TASKS=desktopicon","/LOG=$env:RUNNER_TEMP\setup.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\setup.log" -Tail 40; throw "instalação falhou ($($p.ExitCode))" }
          if (-not (Test-Path "$env:ProgramFiles\CNT Legendas\python\pythonw.exe")) { throw "programa não instalado" }
          if (-not (Test-Path "$env:PUBLIC\Desktop\CNT Legendas.lnk")) { throw "atalho da área de trabalho ausente" }
          if (-not (Test-Path "$env:ProgramData\Microsoft\Windows\Start Menu\Programs\CNT Legendas.lnk")) { throw "atalho do menu Iniciar ausente" }
          $mb = [math]::Round(((Get-ChildItem "$env:ProgramFiles\CNT Legendas" -Recurse | Measure-Object Length -Sum).Sum / 1MB))
          "::notice title=Instalador::$($exe.Name) — {0:N0} MB; instalado ocupa $mb MB" -f ($exe.Length / 1MB)

      - name: Sintetizar fala de teste
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Speech
          $s = New-Object System.Speech.Synthesis.SpeechSynthesizer
          $s.SetOutputToWaveFile("$env:RUNNER_TEMP\fala.wav")
          $s.Speak("The quick brown fox jumps over the lazy dog.")
          $s.Dispose()

      - name: Testar o programa instalado (Python embutido, sem o Python da máquina)
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
        run: |
          $env:PATH = ($env:PATH -split ";" | Where-Object { $_ -notmatch "Python|hostedtoolcache|ffmpeg" }) -join ";"
          $py = "$env:ProgramFiles\CNT Legendas\python\python.exe"
          $env:CNT_SEM_ATUALIZACAO = "1"
          & $py packaging\smoke_test.py "$env:RUNNER_TEMP\fala.wav" "The quick brown fox jumps over the lazy dog."
          if ($LASTEXITCODE) { throw "teste do programa instalado falhou" }
          # partida, canal e assinatura (licença e atualização)
          Push-Location "$env:ProgramFiles\CNT Legendas"
          $info = & $py -c "import cntboot, core.licenca as L, core.atualizacao as A; from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PublicKey; print(A.versao_atual(), L.canal(), cntboot.versao_instalada())"
          Pop-Location
          if ($LASTEXITCODE) { throw "partida/licença não carregam no programa instalado" }
          $esperado = "$((& $py -c 'import core; print(core.__version__)').Trim()).$env:CNT_BUILD"
          if ($info -notmatch [regex]::Escape("$esperado $env:CNT_CANAL $esperado")) { throw "versão/canal errados: $info (esperado $esperado $env:CNT_CANAL)" }
          "::notice title=Partida::$info"
          # pacote de atualização: o código numa pasta de versão, com ffmpeg e modelos do programa instalado
          $pac = "$env:RUNNER_TEMP\pacote"
          Expand-Archive (Get-ChildItem build\Output\Atualizacao_CNT_Legendas_*.zip | Select-Object -First 1).FullName $pac -Force
          & $py packaging\teste_pacote.py $pac "$env:ProgramFiles\CNT Legendas"
          if ($LASTEXITCODE) { throw "o pacote de atualização não roda sobre o programa instalado" }
          # janela própria (WebView2): abre pelo atalho de verdade, espera a tela desenhar e fecha
          $res = "$env:RUNNER_TEMP\janela.txt"
          $wv = Get-ItemProperty "HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}" -ErrorAction SilentlyContinue
          if (-not $wv) {
            "::warning title=Janela::WebView2 não instalado nesta máquina de teste; a janela não foi testada"
          } else {
            $env:CNT_SEM_ATUALIZACAO = "1"
            $p = Start-Process "$env:ProgramFiles\CNT Legendas\python\pythonw.exe" -ArgumentList "-m","cntboot","--port","0","--teste-janela",$res `
              -WorkingDirectory "$env:ProgramFiles\CNT Legendas" -PassThru
            if (-not $p.WaitForExit(120000)) { $p.Kill(); throw "a janela não fechou sozinha em 2 minutos" }
            $r = if (Test-Path $res) { Get-Content $res -Raw } else { "sem resultado" }
            if ($r -notmatch '^ok' -or $r -notmatch 'bandeja=sim') {
              Get-ChildItem "$env:APPDATA\CNT Legendas\logs" -ErrorAction SilentlyContinue | ForEach-Object { Get-Content $_.FullName -Tail 30 }
              throw "janela própria falhou: $r"
            }
            "::notice title=Janela::WebView2 $($wv.pv) — $r"
          }

      - name: Desinstalar
        shell: pwsh
        run: |
          $u = "$env:ProgramFiles\CNT Legendas\unins000.exe"
          Start-Process $u -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait
          # o desinstalador se copia para a pasta temporária e continua em segundo plano
          for ($i = 0; $i -lt 90 -and (Test-Path "$env:ProgramFiles\CNT Legendas\python"); $i++) { Start-Sleep -Seconds 2 }
          if (Test-Path "$env:ProgramFiles\CNT Legendas\python") { throw "desinstalação deixou arquivos" }
          if (Test-Path "$env:PUBLIC\Desktop\CNT Legendas.lnk") { throw "desinstalação deixou o atalho" }
          "::notice title=Desinstalação::programa e atalhos removidos"

      - name: CNT Dubla — instalar, abrir e desinstalar
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
        run: |
          $exe = Get-ChildItem build\Output\Instalador_CNT_Dubla_*.exe | Select-Object -First 1
          $p = Start-Process $exe.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/SP-","/TASKS=desktopicon","/LOG=$env:RUNNER_TEMP\setup-dubla.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\setup-dubla.log" -Tail 40; throw "instalação da Dubla falhou ($($p.ExitCode))" }
          $dir = "$env:ProgramFiles\CNT Dubla"
          if (-not (Test-Path "$dir\dubla\__main__.py")) { throw "Dubla não instalada" }
          if (-not (Test-Path "$env:PUBLIC\Desktop\CNT Dubla.lnk")) { throw "atalho da Dubla ausente" }
          $env:PATH = ($env:PATH -split ";" | Where-Object { $_ -notmatch "Python|hostedtoolcache|ffmpeg" }) -join ";"
          $py = "$dir\python\python.exe"
          Push-Location $dir
          $env:CNT_PRODUTO = "dubla"
          $info = & $py -c "import cntboot, core.licenca as L, core.atualizacao as A; print(A.versao_atual(), L.canal(), cntboot.versao_instalada(), L.servidor())"
          Remove-Item Env:\CNT_PRODUTO
          Pop-Location
          if ($LASTEXITCODE) { throw "partida/licença da Dubla não carregam" }
          Push-Location $dir; $dv = (& $py -c "import dubla; print(dubla.VERSAO)").Trim(); Pop-Location
          $esperado = "$dv.$env:CNT_BUILD"
          if ($info -notmatch [regex]::Escape("$esperado $env:CNT_CANAL $esperado")) { throw "versão/canal da Dubla errados: $info (esperado $esperado)" }
          "::notice title=Dubla::$info"
          $env:CNT_SEM_ATUALIZACAO = "1"; $env:CNT_SEM_REDE = "1"
          $srv = Start-Process $py -ArgumentList "-m","cntboot","--produto","dubla","--sem-navegador","--porta","8767" -WorkingDirectory $dir -PassThru -RedirectStandardError "$env:RUNNER_TEMP\dubla.err"
          $ok = $false
          for ($i = 0; $i -lt 60 -and -not $ok; $i++) { Start-Sleep 1; try { $ok = ((Invoke-WebRequest "http://127.0.0.1:8767/ping" -UseBasicParsing).Content -match "dubla") } catch { } }
          Stop-Process -Id $srv.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { Get-Content "$env:RUNNER_TEMP\dubla.err" -Tail 30; throw "a Dubla instalada não abriu" }
          "::notice title=Dubla::programa instalado abriu e respondeu"
          Start-Sleep 2
          Start-Process "$dir\unins000.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait
          for ($i = 0; $i -lt 90 -and (Test-Path "$dir\python"); $i++) { Start-Sleep -Seconds 2 }
          if (Test-Path "$dir\python") { throw "desinstalação da Dubla deixou arquivos" }

      - name: Versão
        id: versao
        shell: pwsh
        run: |
          $v = (python -c "import core; print(core.__version__)").Trim()
          "v=$v" >> $env:GITHUB_OUTPUT
          "full=$v.$env:CNT_BUILD" >> $env:GITHUB_OUTPUT
          $dv = (python -c "import dubla; print(dubla.VERSAO)").Trim()
          "dubla=$dv.$env:CNT_BUILD" >> $env:GITHUB_OUTPUT
          $msg = git log -1 --format=%B
          "requer=$(if ($msg -match '\[instalador\]') { '1' } else { '0' })" >> $env:GITHUB_OUTPUT
          $notas = (($msg -split "`n") | Where-Object { $_ -notmatch '^(Co-Authored-By|Claude-Session):' }) -join "`n"
          "notas=$([Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($notas.Trim())))" >> $env:GITHUB_OUTPUT

      - name: Publicar versão (página de downloads)
        id: release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/Output/*.exe
          tag_name: v${{ steps.versao.outputs.full }}
          target_commitish: ${{ github.sha }}
          name: CNT Legendas ${{ steps.versao.outputs.full }}
          make_latest: true
          body: |
            Baixe o **Instalador_CNT_Legendas** (ou o **Instalador_CNT_Dubla**, versão ${{ steps.versao.outputs.dubla }})
            abaixo e dê dois cliques. Ele instala tudo (não precisa de Python nem de mais nada) para todos os perfis do Windows.
            Depois de instalado, o programa se atualiza sozinho.

      - name: Publicar pré-versão de desenvolvimento
        if: github.ref == 'refs/heads/dev'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # uma só pré-versão "desenvolvimento", trocada a cada montagem (o instalador tem ~1 GB)
          gh release delete desenvolvimento --cleanup-tag --yes 2>$null
          $exe = (Get-ChildItem build\Output\Instalador_CNT_Legendas_*.exe | Select-Object -First 1).FullName
          $dexe = (Get-ChildItem build\Output\Instalador_CNT_Dubla_*.exe | Select-Object -First 1).FullName
          gh release create desenvolvimento $exe $dexe --prerelease --latest=false --target $env:GITHUB_SHA `
            --title "CNT Legendas ${{ steps.versao.outputs.full }} (desenvolvimento)" `
            --notes "Versão de testes. Não instale no computador de trabalho; ela se atualiza sozinha pelo canal de desenvolvimento."
          if ($LASTEXITCODE) { throw "falha ao publicar a pré-versão" }

      - name: Enviar ao servidor de licenças
        if: github.ref == 'refs/heads/dev' || (github.ref == 'refs/heads/main' && vars.CNT_PROD_ATIVO == '1')
        shell: pwsh
        env:
          CNT_TOKEN: ${{ github.ref == 'refs/heads/dev' && secrets.CNT_TOKEN_DEV || secrets.CNT_TOKEN_PROD }}
          CNT_URL: ${{ github.ref == 'refs/heads/dev' && 'https://dev-legendas.cntoficial.com.br' || 'https://legendas.cntoficial.com.br' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if (-not $env:CNT_TOKEN) { throw "falta o segredo do servidor (CNT_TOKEN_DEV / CNT_TOKEN_PROD)" }
          $full = "${{ steps.versao.outputs.full }}"
          $tag = if ($env:GITHUB_REF -eq "refs/heads/dev") { "desenvolvimento" } else { "v$full" }
          $h = @{ Authorization = "Bearer $env:CNT_TOKEN"; "X-Notas" = "${{ steps.versao.outputs.notas }}"; "X-Requer-Instalador" = "${{ steps.versao.outputs.requer }}" }
          # 1) instalador: só o endereço no GitHub e a soma de conferência (o arquivo é grande demais para o servidor)
          $exe = Get-ChildItem build\Output\Instalador_CNT_Legendas_*.exe | Select-Object -First 1
          $names = gh release view $tag --json assets --jq ".assets[].name"
          if ($names -notcontains $exe.Name) { throw "instalador não encontrado na versão $tag" }
          $url = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/releases/download/$tag/$($exe.Name)"
          $meta = @{ url = $url; sha256 = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower(); tamanho = $exe.Length } | ConvertTo-Json -Compress
          $r = Invoke-RestMethod -Method Put -Uri "$env:CNT_URL/v1/admin/versoes/$full/instalador" -Headers $h `
            -ContentType "application/octet-stream" -Body ([Text.Encoding]::UTF8.GetBytes($meta))
          "::notice title=Servidor::instalador $full registrado ($($r.url))"
          # 2) pacote de atualização (app\ e core\)
          $zip = "build\Output\Atualizacao_CNT_Legendas_$full.zip"
          $r = Invoke-RestMethod -Method Put -Uri "$env:CNT_URL/v1/admin/versoes/$full/patch" -Headers $h `
            -ContentType "application/octet-stream" -InFile $zip
          "::notice title=Servidor::pacote $full publicado ({0:N1} MB, sha256 $($r.sha256.Substring(0,12))…)" -f ($r.tamanho / 1MB)

      - name: Enviar ao servidor da CNT Dubla
        if: github.ref == 'refs/heads/dev' || (github.ref == 'refs/heads/main' && vars.CNT_PROD_ATIVO == '1')
        shell: pwsh
        env:
          CNT_TOKEN: ${{ github.ref == 'refs/heads/dev' && secrets.CNT_DUBLA_TOKEN_DEV || secrets.CNT_DUBLA_TOKEN_PROD }}
          CNT_URL: ${{ github.ref == 'refs/heads/dev' && 'https://dev-dubla.cntoficial.com.br' || 'https://dubla.cntoficial.com.br' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if (-not $env:CNT_TOKEN) { throw "falta o segredo do servidor da Dubla (CNT_DUBLA_TOKEN_DEV / CNT_DUBLA_TOKEN_PROD)" }
          $full = "${{ steps.versao.outputs.full }}"; $dfull = "${{ steps.versao.outputs.dubla }}"
          $tag = if ($env:GITHUB_REF -eq "refs/heads/dev") { "desenvolvimento" } else { "v$full" }
          $h = @{ Authorization = "Bearer $env:CNT_TOKEN"; "X-Notas" = "${{ steps.versao.outputs.notas }}"; "X-Requer-Instalador" = "${{ steps.versao.outputs.requer }}" }
          $exe = Get-ChildItem build\Output\Instalador_CNT_Dubla_*.exe | Select-Object -First 1
          $names = gh release view $tag --json assets --jq ".assets[].name"
          if ($names -notcontains $exe.Name) { throw "instalador da Dubla não encontrado na versão $tag" }
          $url = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/releases/download/$tag/$($exe.Name)"
          $meta = @{ url = $url; sha256 = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower(); tamanho = $exe.Length } | ConvertTo-Json -Compress
          $r = Invoke-RestMethod -Method Put -Uri "$env:CNT_URL/v1/admin/versoes/$dfull/instalador" -Headers $h `
            -ContentType "application/octet-stream" -Body ([Text.Encoding]::UTF8.GetBytes($meta))
          "::notice title=Servidor da Dubla::instalador $dfull registrado"
          $zip = "build\Output\Atualizacao_CNT_Dubla_$dfull.zip"
          $r = Invoke-RestMethod -Method Put -Uri "$env:CNT_URL/v1/admin/versoes/$dfull/patch" -Headers $h `
            -ContentType "application/octet-stream" -InFile $zip
          "::notice title=Servidor da Dubla::pacote $dfull publicado ({0:N1} MB)" -f ($r.tamanho / 1MB)

  unix:
    name: Montar para ${{ matrix.nome }}
    needs: instalador          # a pré-versão "desenvolvimento" é recriada pelo job do Windows; aqui só se acrescenta
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, sistema: linux, nome: Linux }
          - { os: macos-14, sistema: mac, nome: "Mac (Apple Silicon)" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: build/downloads
          key: downloads-${{ matrix.sistema }}-v1
      - name: Montar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get update -q && sudo apt-get install -y -q jq libfuse2 >/dev/null; fi
          bash packaging/build_unix.sh ${{ matrix.sistema }}
      - name: Testar o programa montado (abre, responde, ffprobe e modelos do pacote)
        env:
          CNT_SEM_ATUALIZACAO: "1"
          LEGENDAS_HOME: ${{ runner.temp }}/cnt-home
        run: |
          "$PROG/python/bin/python3" - <<'EOS'
          import os, sys
          sys.path.insert(0, os.environ["PROG"]); os.environ["CNT_INSTALL_ROOT"] = os.environ["PROG"]
          from core import media, vad, plataforma, ortografia
          print("ffprobe:", media.ffprobe()); assert os.environ["PROG"] in str(media.ffprobe())
          assert any(p.exists() for p in vad.model_paths()), "detector de voz"
          print("sistema:", plataforma.nome(), "id:", bool(plataforma.id_maquina()))
          assert ortografia.verificar("A legnda", "pt-BR"), "corretor"
          EOS
          "$PROG/cnt-legendas" --no-browser --port 8766 > "$RUNNER_TEMP/app.log" 2>&1 &
          for i in $(seq 60); do curl -fs http://127.0.0.1:8766/ping && break; sleep 1; done
          curl -fs http://127.0.0.1:8766/ping | grep -q legendas || { cat "$RUNNER_TEMP/app.log"; exit 1; }
          echo "::notice title=${{ matrix.nome }}::programa montado abriu e respondeu"
          kill %1 || true
          CNT_SEM_REDE=1 CNT_DUBLA_HOME="$RUNNER_TEMP/dubla-home" "$DPROG/cnt-dubla" --sem-navegador --porta 8767 > "$RUNNER_TEMP/dubla.log" 2>&1 &
          for i in $(seq 60); do curl -fs http://127.0.0.1:8767/ping && break; sleep 1; done
          curl -fs http://127.0.0.1:8767/ping | grep -q dubla || { cat "$RUNNER_TEMP/dubla.log"; exit 1; }
          echo "::notice title=${{ matrix.nome }}::CNT Dubla montada abriu e respondeu"
          kill %2 || true
      - name: Publicar (pré-versão de desenvolvimento ou versão)
        if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(python3 -c "import core; print(core.__version__)").${{ github.run_number }}
          TAG=$([ "$GITHUB_REF" = "refs/heads/dev" ] && echo desenvolvimento || echo "v$VER")
          gh release upload "$TAG" build/Output/CNT_Legendas_* build/Output/CNT_Dubla_* --clobber
          for f in build/Output/CNT_Legendas_* build/Output/CNT_Dubla_*; do echo "::notice title=Publicado::$(basename "$f") ($(du -h "$f" | cut -f1))"; done
      - name: Registrar no servidor de licenças (download do site e atualização por instalador)
        if: github.ref == 'refs/heads/dev' || (github.ref == 'refs/heads/main' && vars.CNT_PROD_ATIVO == '1')
        env:
          CNT_TOKEN: ${{ github.ref == 'refs/heads/dev' && secrets.CNT_TOKEN_DEV || secrets.CNT_TOKEN_PROD }}
          CNT_URL: ${{ github.ref == 'refs/heads/dev' && 'https://dev-legendas.cntoficial.com.br' || 'https://legendas.cntoficial.com.br' }}
        run: |
          [ -n "$CNT_TOKEN" ] || { echo "falta o segredo do servidor (CNT_TOKEN_DEV / CNT_TOKEN_PROD)"; exit 1; }
          VER=$(python3 -c "import core; print(core.__version__)").$CNT_BUILD
          TAG=$([ "$GITHUB_REF" = "refs/heads/dev" ] && echo desenvolvimento || echo "v$VER")
          # Linux: o .AppImage (um arquivo só); Mac: o .dmg
          F=$(ls build/Output/CNT_Legendas_*.AppImage build/Output/CNT_Legendas_*.dmg 2>/dev/null | head -1)
          [ -n "$F" ] || { echo "pacote não encontrado"; exit 1; }
          N=$(basename "$F")
          SHA=$( (sha256sum "$F" 2>/dev/null || shasum -a 256 "$F") | cut -d' ' -f1)
          TAM=$(wc -c < "$F" | tr -d ' ')
          REQ=$(git log -1 --format=%B | grep -q '\[instalador\]' && echo 1 || echo 0)
          URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$TAG/$N"
          curl -fsS -X PUT "$CNT_URL/v1/admin/versoes/$VER/instalador" -H "Authorization: Bearer $CNT_TOKEN" \
            -H "Content-Type: application/octet-stream" -H "X-Sistema: ${{ matrix.sistema }}" -H "X-Requer-Instalador: $REQ" \
            --data-binary "{\"url\":\"$URL\",\"sha256\":\"$SHA\",\"tamanho\":$TAM}" > /dev/null
          echo "::notice title=Servidor::instalador ${{ matrix.sistema }} $VER registrado ($N)"
      - name: Registrar no servidor da CNT Dubla
        if: github.ref == 'refs/heads/dev' || (github.ref == 'refs/heads/main' && vars.CNT_PROD_ATIVO == '1')
        env:
          CNT_TOKEN: ${{ github.ref == 'refs/heads/dev' && secrets.CNT_DUBLA_TOKEN_DEV || secrets.CNT_DUBLA_TOKEN_PROD }}
          CNT_URL: ${{ github.ref == 'refs/heads/dev' && 'https://dev-dubla.cntoficial.com.br' || 'https://dubla.cntoficial.com.br' }}
        run: |
          [ -n "$CNT_TOKEN" ] || { echo "falta o segredo do servidor da Dubla (CNT_DUBLA_TOKEN_DEV / CNT_DUBLA_TOKEN_PROD)"; exit 1; }
          VER=$(python3 -c "import core; print(core.__version__)").$CNT_BUILD
          DVER=$(python3 -c "import dubla; print(dubla.VERSAO)").$CNT_BUILD
          TAG=$([ "$GITHUB_REF" = "refs/heads/dev" ] && echo desenvolvimento || echo "v$VER")
          F=$(ls build/Output/CNT_Dubla_*.AppImage build/Output/CNT_Dubla_*.dmg 2>/dev/null | head -1)
          [ -n "$F" ] || { echo "pacote da Dubla não encontrado"; exit 1; }
          N=$(basename "$F")
          SHA=$( (sha256sum "$F" 2>/dev/null || shasum -a 256 "$F") | cut -d' ' -f1)
          TAM=$(wc -c < "$F" | tr -d ' ')
          REQ=$(git log -1 --format=%B | grep -q '\[instalador\]' && echo 1 || echo 0)
          URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$TAG/$N"
          curl -fsS -X PUT "$CNT_URL/v1/admin/versoes/$DVER/instalador" -H "Authorization: Bearer $CNT_TOKEN" \
            -H "Content-Type: application/octet-stream" -H "X-Sistema: ${{ matrix.sistema }}" -H "X-Requer-Instalador: $REQ" \
            --data-binary "{\"url\":\"$URL\",\"sha256\":\"$SHA\",\"tamanho\":$TAM}" > /dev/null
          echo "::notice title=Servidor da Dubla::instalador ${{ matrix.sistema }} $DVER registrado ($N)"
