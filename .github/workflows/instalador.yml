name: Instalador

# Em todo push na main: monta, instala, testa e desinstala.
# Se tudo passar, publica o instalador na página de versões (Releases) como
# v<versão do core/__init__.py>; a mesma versão é atualizada até o número mudar.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  instalador:
    name: Gerar e testar o instalador (Windows)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Cache de downloads
        uses: actions/cache@v4
        with:
          path: build\downloads
          key: downloads-py3.12.10-ffmpeg-v2
      - name: Montar programa e gerar instalador
        shell: pwsh
        run: .\packaging\build.ps1

      - name: Instalar a versão antiga ("Legendas" 0.5.0), para testar a atualização
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.5.0 -p "Instalador_Legendas_*.exe" -D "$env:RUNNER_TEMP\antigo"
          $old = Get-ChildItem "$env:RUNNER_TEMP\antigo\*.exe" | Select-Object -First 1
          $p = Start-Process $old.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/SP-","/TASKS=desktopicon" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "instalação da versão antiga falhou" }
          New-Item -ItemType Directory -Force "$env:ProgramData\Legendas\modelos\teste" | Out-Null
          "x" | Set-Content "$env:ProgramData\Legendas\modelos\teste\marca.txt"
          if (-not (Test-Path "$env:PUBLIC\Desktop\Legendas.lnk")) { throw "versão antiga sem atalho" }

      - name: Instalar (silencioso), como faria no PC dela
        shell: pwsh
        run: |
          $exe = Get-ChildItem build\Output\Instalador_CNT_Legendas_*.exe | Select-Object -First 1
          "Tamanho do instalador: {0:N0} MB" -f ($exe.Length / 1MB)
          $p = Start-Process $exe.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/SP-","/TASKS=desktopicon","/LOG=$env:RUNNER_TEMP\setup.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\setup.log" -Tail 40; throw "instalação falhou ($($p.ExitCode))" }
          if (-not (Test-Path "$env:ProgramFiles\CNT Legendas\python\pythonw.exe")) { throw "programa não instalado" }
          if (-not (Test-Path "$env:PUBLIC\Desktop\CNT Legendas.lnk")) { throw "atalho da área de trabalho ausente" }
          if (-not (Test-Path "$env:ProgramData\Microsoft\Windows\Start Menu\Programs\CNT Legendas.lnk")) { throw "atalho do menu Iniciar ausente" }
          # atualização: a versão antiga sai, os modelos baixados vêm junto
          if (Test-Path "$env:ProgramFiles\Legendas\python") { throw "a versão antiga ficou instalada" }
          if (Test-Path "$env:PUBLIC\Desktop\Legendas.lnk") { throw "o atalho antigo ficou" }
          if (-not (Test-Path "$env:ProgramData\CNT Legendas\modelos\teste\marca.txt")) { throw "modelos antigos não foram migrados" }
          $mb = [math]::Round(((Get-ChildItem "$env:ProgramFiles\CNT Legendas" -Recurse | Measure-Object Length -Sum).Sum / 1MB))
          "::notice title=Instalador::$($exe.Name) — {0:N0} MB; instalado ocupa $mb MB" -f ($exe.Length / 1MB)

      - name: Sintetizar fala de teste
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Speech
          $s = New-Object System.Speech.Synthesis.SpeechSynthesizer
          $s.SetOutputToWaveFile("$env:RUNNER_TEMP\fala.wav")
          $s.Speak("The quick brown fox jumps over the lazy dog.")
          $s.Dispose()

      - name: Testar o programa instalado (Python embutido, sem o Python da máquina)
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
        run: |
          $env:PATH = ($env:PATH -split ";" | Where-Object { $_ -notmatch "Python|hostedtoolcache|ffmpeg" }) -join ";"
          $py = "$env:ProgramFiles\CNT Legendas\python\python.exe"
          & $py packaging\smoke_test.py "$env:RUNNER_TEMP\fala.wav" "The quick brown fox jumps over the lazy dog."
          if ($LASTEXITCODE) { throw "teste do programa instalado falhou" }

      - name: Desinstalar
        shell: pwsh
        run: |
          $u = "$env:ProgramFiles\CNT Legendas\unins000.exe"
          Start-Process $u -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait
          # o desinstalador se copia para a pasta temporária e continua em segundo plano
          for ($i = 0; $i -lt 90 -and (Test-Path "$env:ProgramFiles\CNT Legendas\python"); $i++) { Start-Sleep -Seconds 2 }
          if (Test-Path "$env:ProgramFiles\CNT Legendas\python") { throw "desinstalação deixou arquivos" }
          if (Test-Path "$env:PUBLIC\Desktop\CNT Legendas.lnk") { throw "desinstalação deixou o atalho" }
          "::notice title=Desinstalação::programa e atalhos removidos"

      - name: Versão
        id: versao
        shell: pwsh
        run: |
          $v = (python -c "import core; print(core.__version__)").Trim()
          "v=$v" >> $env:GITHUB_OUTPUT

      - name: Publicar versão (página de downloads)
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/Output/*.exe
          tag_name: v${{ steps.versao.outputs.v }}
          target_commitish: ${{ github.sha }}
          name: CNT Legendas ${{ steps.versao.outputs.v }}
          make_latest: true
          body: |
            Baixe o **Instalador_CNT_Legendas** abaixo e dê dois cliques. Ele instala tudo
            (não precisa de Python nem de mais nada) para todos os perfis do Windows.
