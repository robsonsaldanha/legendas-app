<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="token" content="{{TOKEN}}">
  <title>CNT Legendas</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <div class="shell">
    <aside class="side">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><rect x="1" y="5" width="30" height="22" rx="3"/><rect class="mark-bar" x="6" y="18" width="20" height="3" rx="1.5"/><rect class="mark-bar" x="9" y="22.5" width="14" height="2.5" rx="1.25"/></svg>
        <span>CNT Legendas</span>
      </div>
      <nav class="nav" aria-label="Principal">
        <a href="#/inicio" data-nav="inicio">Início</a>
        <a href="#/editor" data-nav="editor">Editor</a>
        <a href="#/clientes" data-nav="clientes">Clientes</a>
        <a href="#/trabalhos" data-nav="trabalhos">Trabalhos <span class="count" id="running-count" hidden></span></a>
        <a href="#/configuracoes" data-nav="configuracoes">Configurações</a>
      </nav>
      <div class="side-foot">
        <span class="muted small">Versão {{VERSION}}</span>
      </div>
    </aside>
    <main id="main" class="main" tabindex="-1"></main>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script src="/editor.js"></script>
  <script src="/tools.js"></script>
  <script src="/home.js"></script>
  <script src="/app.js"></script>
</body>
</html>
